calibration_options:
  tropo:
    mode: stratified
  grid_type: constant
  reference_frame: IGS20
  unwrap_error_correction: false
  apply_tropo_correction: false
  apply_solid_earth_tide_correction: true
  window_size_meters: 600000.0
  posting_meters: 30.0
  downsample_factor: 6
  downsample_method: mean
  downsample_weighted: false
  event_mask_buffer_pixels: 0
  residual_outlier_mad_threshold:
  residual_region_mad_threshold:
  residual_region_min_pixels: 20
  mask_fit_residual_outliers: true
  weight_fit_by_gnss_uncertainty: false
  calibration_surface_smoothing_method: gaussian
  calibration_surface_smoothing_sigma: 0.0
  savitzky_golay:
    window_length: 51
    polyorder: 3
  # v0.5 for the 8-frame gate (T46): T38 config + 50 km GNSS grid buffer (cal-disp PR #10)
  # coherence^8 + robust weights, sigma_CAL with k = 3.9
  surface:
    method: loclin
    cutoff_wavelength_meters: 50000.0
    fill_gaps: true
    two_pass: true
  weights:
    coherence_power: 8.0
    robust: true
  uncertainty:
    k_grid: 3.9
  # grid nodes within 50 km outside the frame constrain the edges (R-G2)
  gnss:
    buffer_meters: 50000.0
