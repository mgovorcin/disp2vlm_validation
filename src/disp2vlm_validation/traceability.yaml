# Requirements traceability (Venti PRD sections 2.7 and 3.4; plan T24.3).
# Each entry: requirement -> the metric that verifies it -> how it is judged.
# `check` names a rule in disp2vlm_validation.report.TRACE_CHECKS.
- id: GATE-1
  requirement: "Calibration lowers the double-difference sill (PRD 2.7)"
  metric: double_difference.calibrated.sill vs double_difference.raw.sill
  check: sill_below_raw
  gating: true
- id: GATE-2
  requirement: "Sill does not rise > 5% (significant) vs the released baseline (PRD 2.7)"
  metric: sill_change_vs_baseline
  check: sill_vs_baseline
  gating: true
- id: GATE-3
  requirement: "Velocity RMSE and |median bias| vs MIDAS rise <= 0.2 mm/yr vs baseline (PRD 2.7, decision 0001)"
  metric: deltas.velocity_rmse_change_mm_yr, deltas.velocity_abs_bias_change_mm_yr
  check: velocity_vs_baseline
  gating: true
- id: GATE-4
  requirement: "Golden-epoch product reproduces the golden (PRD 2.7, R-O4)"
  metric: golden_epoch_check
  check: golden_epoch
  gating: true
- id: TARGET-1
  requirement: "|median bias| <= 1 mm/yr per frame (release target, PRD 2.7, decision 0001)"
  metric: velocity_los.calibrated.median
  check: bias_target
  gating: false
- id: R-V1
  requirement: "Validation uses only independent GNSS (UNR daily + MIDAS) (PRD 3.4)"
  metric: GATE.independent_gnss_only
  check: independent_gnss
  gating: false
- id: R-V2
  requirement: "Metrics per station class (stable, subsiding, coastal, defo area, near event) (PRD 3.4)"
  metric: velocity_by_class
  check: classes_reported
  gating: false
